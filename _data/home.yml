  cipher_secret: "🌙 ⭕️ 🔒 🔺"
  cipher_alt: "HOLA escrito en Marlek"
  cipher_caption: "Ejemplo ilustrativo. La tabla real vive dentro de la app."
  privacy_h: "Privacidad"
