markdown: kramdown

# An explicit list (as in ASVAB Coach): with Jekyll's default list, the
# github-pages gem appends CNAME to it and drops CNAME from the built site.
exclude:
  - README.md
  - .gitignore

# Jekyll ignores dotdirs by default; RFC 9116 needs /.well-known/security.txt.
include:
  - .well-known
