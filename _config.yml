title: Marlek
short_name: Marlek
description: "Marlek traduce del español a un código secreto hecho de emojis y símbolos, y de vuelta. Mensajes secretos entre amigos y hermanos. App para iPhone y iPad."
url: https://marlek.khassinx.com

# The root is Spanish: / and /en/, with the URLs the app has fixed (/privacidad/, /soporte/…).
lang: es
home_url:
  es: /
  en: /en/
privacy_url:
  es: /privacidad/
  en: /en/privacy/
# Browser chrome follows Marlek's ground (assets/css/app.css), not the studio's.
theme_color:
  dark: "#07120D"
  light: "#FFFFFF"

# Legal entity (KHASSINX LLC, Florida single-member LLC). The Marlek language,
# its cipher and its table are the work of its creator, Slime@YT.
org_legal_name: "KHASSINX LLC"
org_founding_date: "2026-06-01"

app_store_url: https://apps.apple.com/app/id6777882318

# JSON-LD MobileApplication on the home page (_includes/home.html). Facts of the app, measured in its
# project.yml (iPhone and iPad only, education category, no StoreKit) and its String Catalog (es, en).
app_schema:
  name: "Marlek"
  operating_system: "iOS, iPadOS"
  category: EducationalApplication
  price: "0"
  price_currency: USD
  offer_category: Free
  languages: ["es", "en"]
  free: true
  creator: "Slime@YT"

favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

# Open Graph image, by locale — overridable per page
og_image_default:
  es: /assets/og/og-image-es.png
  en: /assets/og/og-image-en.png
og_image_alt:
  es: "Marlek: un código secreto hecho de emojis y símbolos."
  en: "Marlek: a secret code made of emoji and symbols."

footer_nav:
