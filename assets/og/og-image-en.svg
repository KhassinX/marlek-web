<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Marlek — your own secret code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04241A"/>
      <stop offset="0.55" stop-color="#0A3D2A"/>
      <stop offset="1" stop-color="#0E5538"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04241A"/>
      <stop offset="0.55" stop-color="#0A3D2A"/>
      <stop offset="1" stop-color="#0E5538"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- v3 Cipher M icon, left -->
  <g transform="translate(120,165) scale(0.293)">
    <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
      <g fill="none" stroke="#5BFB6A" stroke-width="76" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="232,780 232,260 457,485"/>
        <polyline points="792,780 792,260 567,485"/>
      </g>
      <g fill="#5BFB6A">
        <circle cx="232" cy="260" r="46"/><circle cx="792" cy="260" r="46"/>
        <circle cx="232" cy="780" r="46"/><circle cx="792" cy="780" r="46"/>
      </g>
      <circle cx="512" cy="540" r="78" fill="none" stroke="#5BFB6A" stroke-width="38"/>
      <circle cx="512" cy="540" r="24" fill="#5BFB6A"/>
  </g>
  <!-- Text, right -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="270" fill="#ECF7F0" font-size="84" font-weight="700" letter-spacing="-2">Marlek</text>
    <text x="500" y="350" fill="#5BFB6A" font-size="40" font-weight="600">Your own secret code</text>
    <text x="500" y="410" fill="#A6BBB0" font-size="30" font-weight="400">Turn Spanish into a code of emoji</text>
    <text x="500" y="450" fill="#A6BBB0" font-size="30" font-weight="400">and symbols — and back again.</text>
    <text x="500" y="525" fill="#7E948A" font-size="24" font-weight="400">iPhone · iPad  ·  created by Slime@YT</text>
  </g>
</svg>
